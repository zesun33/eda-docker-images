# Publishes the EDA container images to GitHub Container Registry.
#
# No credentials needed beyond the automatic GITHUB_TOKEN (granted
# packages:write below). First builds are slow (fpga/asic ~30-60 min);
# subsequent runs reuse the GHA layer cache.
#
#   Tag a release:  git tag v0.3.0 && git push origin v0.3.0
#                   -> pushes ghcr.io/zesun33/<img>:v0.3.0 + :latest
#   Manual canary:  Actions -> publish -> Run workflow (single image)

name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      image:
        description: "Image to publish (empty = all four)"
        required: false
        default: ""
        type: choice
        options: ["", verilog, spice, fpga, asic]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: verilog
            dockerfile: docker/verilog/Dockerfile
            timeout: 30
          - image: spice
            dockerfile: docker/spice/Dockerfile
            timeout: 30
          - image: fpga
            dockerfile: docker/fpga/Dockerfile
            timeout: 180
          - image: asic
            dockerfile: docker/asic/Dockerfile
            timeout: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select images
        id: select
        run: |
          if [ -n "${{ inputs.image }}" ] && [ "${{ inputs.image }}" != "${{ matrix.image }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.select.outputs.run == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.select.outputs.run == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.select.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/zesun33/${{ matrix.image }}:latest
            ghcr.io/zesun33/${{ matrix.image }}:${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
